<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Halls of Valor</title>
    <!-- black from the first paint (the stylesheet arrives with the scripts): no navy flash before the studio splash -->
    <style>html,body{background:#000}#splash{z-index:20;background:#050304;place-items:center;transition:opacity .45s;display:grid;position:fixed;inset:0}#status{z-index:30}#splash.out{opacity:0;pointer-events:none}#splash img{opacity:0;max-width:80vw;max-height:70vh;transition:opacity .6s,transform 1.6s ease-out;transform:scale(.94)}#splash.in img{opacity:1;transform:none}#splash i{background:#d6a84a2e;width:min(220px,40vw);height:2px;position:absolute;bottom:12vh;left:50%;overflow:hidden;transform:translate(-50%)}#splash i:after{content:"";background:linear-gradient(90deg,#0000,#f3cf7a,#0000);width:40%;animation:1.3s ease-in-out infinite splash-run;position:absolute;inset:0}@keyframes splash-run{0%{transform:translate(-100%)}to{transform:translate(250%)}}@media (orientation:portrait){#splash img{max-height:50vh}}@media (prefers-reduced-motion:reduce){#splash img,#splash i:after{transition:none;animation:none;transform:none}}</style>
    <!-- self-hosted, subset fonts (src/app/fonts.css): fetched in parallel with the JS, before any text is drawn -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/cinzel-900-latin-B4SzILZD.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/cinzel-700-latin-DOVZCYN2.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/grenze-500-latin-Q0_IdWW6.woff2" />
    <script type="module" crossorigin src="./assets/index-DmIYgnW6.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/CanvasPool-BKClwQdf.js">
    <link rel="modulepreload" crossorigin href="./assets/Filter-s8q4dxyZ.js">
    <link rel="modulepreload" crossorigin href="./assets/canvasUtils-B0HNDru7.js">
    <link rel="modulepreload" crossorigin href="./assets/Cache-fNcOcM1E.js">
    <link rel="modulepreload" crossorigin href="./assets/GCManagedHash-Cz2cl0E7.js">
    <link rel="modulepreload" crossorigin href="./assets/RenderTargetSystem-DAG-qshi.js">
    <link rel="modulepreload" crossorigin href="./assets/getTextureBatchBindGroup-CIH9f4hr.js">
    <link rel="modulepreload" crossorigin href="./assets/GraphicsContext-BP119UXX.js">
    <link rel="modulepreload" crossorigin href="./assets/getTexelRangeRects-Caq4QYi0.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BZ-aaN1e.css">
  </head>
  <body>
    <div id="game" aria-hidden="true"></div>
    <div id="ui"></div>
    <div id="splash" aria-hidden="true"><img alt="" /><i></i></div>
    <script>
      // the ident image is set here, not in the markup, so it resolves against the page (relative base on Engine)
      (function () {
        var s = document.getElementById("splash");
        var img = s && s.querySelector("img");
        if (!img) return;
        img.onload = function () {
          s.dataset.shown = String(performance.now());
          s.classList.add("in");
        };
        img.src = "assets/brand/studio_lockup.webp";
      })();
    </script>
    <div id="status" role="status" hidden></div>
    <div id="fatal" role="alert" hidden>⚠</div>
  </body>
</html>
